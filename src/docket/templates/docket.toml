# Docket configuration.
# This file is hand-maintained. Comments and key order survive every write the tool makes.

# Where tickets live, relative to this file.
root = "docs/tickets"

# Tickets with status todo or wip live here. Only done moves a file.
todoDir = "todo"
doneDir = "done"

# Priority is an integer with 0 most urgent. New tickets get defaultPriority, and validate enforces the ceiling.
defaultPriority = 2
maxPriority = 4

# Keys group related work. A ticket id is <KEY>-<NUM>.
# Add a key here with a short description of what it covers. A key must exist before tickets can use it.
[keys]

# Keys an agent proposed through propose_key, usable immediately but awaiting your decision.
# Promote one with `docket key approve <KEY>`, or drop it with `docket key reject <KEY>`.
[keys.proposed]
