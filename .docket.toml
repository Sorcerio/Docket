# Docket configuration.
# This file is hand-maintained. Comments and key order survive every write the tool makes.

# Where tickets live, relative to this file.
root = "docs/tickets"

# Tickets with status todo or wip live here. Only done moves a file.
todoDir = "todo"
doneDir = "done"

# Priority is an integer with 0 most urgent. New tickets get defaultPriority, and validate enforces the ceiling.
defaultPriority = 2
maxPriority = 4

# How long, in seconds, one docket process waits for another to finish writing before giving up.
# Writes are serialized across processes, so a CLI command and a running MCP server never overwrite each other.
lockTimeout = 5.0

# Keys group related work. A ticket id is <KEY>-<NUM>.
# Add a key here with a short description of what it covers, or run `docket key add <KEY> "<DESCRIPTION>"`. A key must exist before tickets can use it.
# An agent adds one through add_key, which it is told to do only after asking you first.
#
# Do not add a DOCK key here. It is reserved for the README demo recording.
# docs/demo/docket.tape registers it, uses DOCK-1 through DOCK-3, and removes it again on every render.
[keys]
BUG = "Tickets that are for bugs"
FEAT = "Tickets that are for future features"
