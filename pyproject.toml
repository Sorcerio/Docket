[project]
name = "docket"
dynamic = ["version"]
description = "A per-repo ticketing system that is plain markdown for humans and structured MCP for agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.32.2",
    "mcp>=2,<3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "rich-argparse>=1.8.0",
    "tomlkit>=0.15.1",
]

[project.scripts]
docket = "docket.cli:main"
docket-mcp = "docket.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/docket/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/docket"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
