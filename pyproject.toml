[project]
name = "docket"
dynamic = ["version"]
description = "A per-repo ticketing system that is plain markdown for humans and structured MCP for agents"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Sorcerio" }]
keywords = [
    "tickets",
    "issue-tracker",
    "project-management",
    "mcp",
    "agents",
    "markdown",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "filelock>=3.32.2",
    "mcp>=2,<3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "rich-argparse>=1.8.0",
    "tomlkit>=0.15.1",
]

[project.urls]
Homepage = "https://github.com/Sorcerio/Docket"
Repository = "https://github.com/Sorcerio/Docket"
Issues = "https://github.com/Sorcerio/Docket/issues"

[project.scripts]
docket = "docket.cli:main"
docket-mcp = "docket.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/docket/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/docket"]

# Exclude non-required files from the wheel distribution
[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "scripts",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "twine>=6.1.0",
]
