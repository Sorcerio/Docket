name: Release

# Bare numeric tags, matching the `1.0.0` convention this repository already uses.
on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

jobs:
  test:
    name: Test
    # The whole suite, on the tagged commit, as the gate. A red run here means nothing reaches PyPI.
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest

    # The environment the PyPI trusted publisher is registered against. Renaming it breaks the OIDC exchange.
    environment: pypi

    permissions:
      contents: read
      # The claim PyPI verifies in place of a long lived token.
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify the tag matches the packaged version
        # A version number is spent the moment PyPI accepts it, so a tag disagreeing with `__version__` has to fail before the upload rather than after.
        run: |
          packaged=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+)\"', pathlib.Path('src/docket/__init__.py').read_text())[1])")
          echo "Tag: ${{ github.ref_name }}"
          echo "Packaged: $packaged"
          if [ "${{ github.ref_name }}" != "$packaged" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match the packaged version $packaged."
            exit 1
          fi

      - name: Build the distributions
        run: uv build

      - name: Publish
        # No token anywhere. `always` fails loudly rather than falling back to a credential that does not exist.
        run: uv publish --trusted-publishing always
